<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEP5 単語 1077–1183</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>STEP 5</span> 1900ワードレベル No.1077–1183</h1>
    <p>一覧・カード・4択・スペル・例文穴埋めで覚える。間違えた単語はこのブラウザに記録されます。</p>
  </header>

  <section class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><span class="label">範囲</span><div class="row" id="chips"></div></div>
    <div class="row">
      <span class="label">番号</span>
      <input type="number" id="from" min="1077" max="1183" value="1077" aria-label="開始番号"> 〜
      <input type="number" id="to" min="1077" max="1183" value="1183" aria-label="終了番号">
      <label class="row" style="gap:4px;margin-left:8px"><input type="checkbox" id="weak"> 苦手だけ</label>
      <span class="count" id="count"></span>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view" class="panel"></main>
  <div class="row center"><button class="btn" id="reset" style="font-size:.8rem">記録をリセット</button><span class="count" id="resetMsg"></span></div>
</div>
<script src="app.js"></script>
</body>
</html>
